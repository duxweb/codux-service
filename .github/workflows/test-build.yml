name: Test Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "duxweb/codux ref to build, for example main, v1.8.0, or a commit SHA"
        required: false
        default: main

jobs:
  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codux source
        uses: actions/checkout@v4
        with:
          repository: duxweb/codux
          ref: ${{ github.event.inputs.source_ref || 'main' }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test -p codux-server

  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Codux source
        uses: actions/checkout@v4
        with:
          repository: duxweb/codux
          ref: ${{ github.event.inputs.source_ref || 'main' }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build artifact
        run: bash apps/server/scripts/release/build.sh dev
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codux-service-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz*

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codux source
        uses: actions/checkout@v4
        with:
          repository: duxweb/codux
          ref: ${{ github.event.inputs.source_ref || 'main' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: codux-service:dev
          build-args: |
            VERSION=dev
